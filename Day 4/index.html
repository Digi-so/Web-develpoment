<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes Draft</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <main>
      <section class="notes-container">
        <h1>QuickNotes</h1>
        <p>Write your note below. Your draft will be saved automatically.</p>

        <label for="note-text">Your note</label>
        <textarea
          id="note-text"
          maxlength="200"
          placeholder="Start typing your note..."
        ></textarea>

        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>

        <div class="buttons">
          <button id="clear-btn" type="button">Clear</button>
          <button id="theme-toggle" type="button">Dark mode</button>
        </div>
      </section>
    </main>
  </body>
</html>
