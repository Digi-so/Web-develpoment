```html
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Capture ideas before they disappear.</p>
    </header>

    <main>
      <section>
        <h2>Add a note</h2>

        <form id="note-form">
          <label for="note-input">New note</label>

          <input
            type="text"
            id="note-input"
            placeholder="Type a note..."
          />

          <label for="note-category">Category</label>

          <select id="note-category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>

          <button type="submit">Add Note</button>
        </form>

        <p id="error-message"></p>
      </section>

      <section>
        <h2>Your notes</h2>

        <label for="search-input">Search notes</label>
        <input
          type="search"
          id="search-input"
          placeholder="Search your notes..."
        />

        <p id="note-count">You have no notes yet.</p>

        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
  </body>
</html>
```
