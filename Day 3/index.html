<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes Toolkit</title>
    <style>
      body { max-width: 720px; margin: 3rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; color: #222; }
      h1 { margin-bottom: 0.25rem; }
      #summary { color: #555; margin-top: 0; }
      #notes { padding: 0; list-style: none; }
      #notes li { margin: 0.75rem 0; padding: 0.85rem 1rem; border: 1px solid #ddd; border-radius: 8px; }
      .category { display: inline-block; margin-left: 0.5rem; color: #555; font-size: 0.85rem; }
    </style>
    <script src="script.js" defer></script>
  </head>

  <body>
    <main>
      <h1>My Notes</h1>
      <p id="summary" aria-live="polite"></p>
      <ul id="notes"></ul>
    </main>
  </body>
</html>
